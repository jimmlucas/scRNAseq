    checkpoint_after: PCC_QC_SCORES
    resource_class: high_memory
    can_start_from: true
    can_resume_from_output: true

    invalidates:
      - NORMALIZATION
      - INTEGRATION
      - CLUSTERING
      - MARKERS
      - ANNOTATION
      - DIFFERENTIAL_EXPRESSION
      - PATHWAY_ANALYSIS


