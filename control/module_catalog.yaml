schema_version: "1.0"

pipeline:
  id: scrna_seq
  name: scRNA-seq analysis pipeline

artifact_types:

  raw_inputs:
    description: Input targets file and per-sample count directories.

  analysis_plan_yaml:
    description: >
      Validated analysis plan containing experiment metadata,
      requested routes and approval policies.

  resolved_analysis_routing:
    description: >
      Resolved availability and execution state for every route
      requested in the analysis plan.

  resolved_load_config:
    description: >
      Runtime LOAD_DATA configuration resolved from a validated
      analysis plan.

  input_inventory:
    description: >
      Lightweight inventory of declared inputs, metadata columns,
      samples, modalities and directory structure.

  input_sample_manifest:
    description: >
      Standardized sample-level manifest generated without loading
      expression matrices.

  loaded_seurat:
    description: Merged Seurat object after loading input samples.

  qc_filtered_seurat:
    description: Seurat object after cell and gene QC filtering.

  qc_visualization_report:
    description: QC plots and per-cell/per-sample QC metadata.

  qc_visualization_summary:
    description: >
      Summary table describing before/after QC visualization inputs,
      retained cells and generated plot artifacts.

  qc_metric_distributions:
    description: >
      Long-format table of QC metric distributions before and after
      filtering, suitable for report plots.

  qc_sample_retention:
    description: >
      Per-sample retained/removed cell counts and retention fractions after
      applying an approved QC policy.

  qc_exclusion_reasons:
    description: >
      Summary table of cell exclusion reasons produced by an approved QC
      filtering policy.

  singlet_seurat:
    description: >
      Seurat object after the doublet-detection policy has been
      applied.

  doublet_scored_seurat:
    description: >
      Seurat object after per-sample doublet scoring has been added.
      This artifact preserves all cells and is not an approved filter.

  doublet_detection_policy:
    description: >
      Proposed or approved policy describing which doublet classifications
      may be applied during a later filtering step.

  doublet_policy_resolution:
    description: >
      Summary describing how a proposed doublet policy was resolved from
      technical doublet scoring outputs.

  approved_doublet_policy:
    description: >
      Human-reviewed doublet policy validated for use by DOUBLET_FILTER.

  doublet_policy_approval_summary:
    description: >
      Validation record containing reviewer identity, approval status,
      timestamp and approved doublet counts.

  applied_doublet_policy:
    description: >
      Copy of the approved doublet policy after DOUBLET_FILTER has
      recorded the application state.

  doublet_removed_cells:
    description: >
      Cell-level audit table listing every cell removed by an approved
      doublet filter policy.

  analysis_warnings:
    description: >
      Structured warnings produced by readiness checks before starting
      downstream analysis.

  analysis_readiness:
    description: >
      Machine-readable readiness contract describing whether the
      post-QC dataset can enter the next analysis phase.

  normalization_policy:
    description: >
      Proposed or approved normalization policy describing method,
      variable feature selection and downstream integration intent.

  normalization_policy_resolution:
    description: >
      Summary describing how a proposed normalization policy was
      resolved from the post-doublet readiness contract.

  approved_normalization_policy:
    description: >
      Human-reviewed normalization policy validated for use by
      NORMALIZATION.

  normalization_policy_approval_summary:
    description: >
      Validation record containing reviewer identity, approval status,
      timestamp and approved normalization strategy.

  normalized_seurat:
    description: >
      Seurat object after applying the approved normalization policy.

  normalized_sample_objects:
    description: >
      Directory containing per-sample normalized Seurat objects generated
      before the combined normalized object is written.

  normalization_summary:
    description: >
      Audit summary describing the applied normalization method, input/output
      dimensions and policy state.

  variable_features:
    description: >
      Feature-level table listing variable features selected per sample.

  applied_normalization_policy:
    description: >
      Copy of the approved normalization policy after NORMALIZATION has
      recorded the application state.

  pca_seurat:
    description: >
      Seurat object after scaling variable features and computing PCA from
      the normalized assay.

  dimensionality_summary:
    description: >
      Audit summary describing scaling, PCA dimensions, input/output counts
      and upstream normalization policy state.

  pca_embeddings_preview:
    description: >
      Small cell-level PCA embedding preview intended for inspection and
      downstream readiness checks.

  pca_loadings_preview:
    description: >
      Small feature-level PCA loading preview intended for inspection and
      downstream readiness checks.

  pca_elbow_metrics:
    description: >
      Per-PC standard deviation and explained-variance metrics used to
      support downstream PC and integration decisions.

  pc_selection_policy:
    description: >
      Proposed or approved policy describing how many principal components
      downstream neighborhood, UMAP, clustering or integration phases may use.

  pc_selection_policy_resolution:
    description: >
      Summary describing how a proposed PC-selection policy was resolved
      from dimensionality metrics.

  approved_pc_selection_policy:
    description: >
      Human-reviewed PC-selection policy validated for use by downstream
      neighborhood, UMAP, clustering or integration phases.

  pc_selection_policy_approval_summary:
    description: >
      Validation record containing reviewer identity, approval status,
      timestamp, proposed PCs and selected PCs.

  integration_policy:
    description: >
      Proposed or approved policy describing whether integration is required,
      which method should be used and which reduction/dimensions downstream
      phases should consume.

  integration_policy_resolution:
    description: >
      Summary describing how a proposed integration policy was resolved from
      PCA evidence, readiness, selected PCs and applied normalization.

  qc_scored_seurat:
    description: >
      Seurat object after cell-cycle and dissociation scores have
      been added.

  metrics:
    description: General module-level metrics or summary table.

  per_sample_metrics:
    description: Metrics summarized independently for each sample.

  per_group_metrics:
    description: Metrics summarized by experimental group.

  phase_metrics:
    description: Metrics describing cell-cycle phase assignments.

  cell_metadata:
    description: Cell-level metadata exported as a tabular artifact.

  session_info:
    description: Runtime, package and environment information.

  qc_metrics_seurat:
    description: >
      Seurat object with QC metrics added while preserving all cells
      and features from the loaded input object.

  qc_threshold_policy:
    description: >
      Proposed or approved QC threshold policy containing explicit
      per-metric bounds, provenance, rationale and approval status.

  qc_threshold_resolution:
    description: >
      Summary describing how QC thresholds were proposed from the
      observed cell-level and sample-level QC distributions.

  approved_qc_threshold_policy:
    description: >
      Human-reviewed QC threshold policy validated for use by
      QC_FILTER.

  qc_threshold_approval_summary:
    description: >
      Validation record containing reviewer identity, approval
      status, timestamp and enabled threshold count.

modules:

  INPUT_DISCOVERY:
    stage: input
    process_name: INPUT_DISCOVERY
    mode: analysis_plan_qc_process
    script: scripts/control/input_discovery.py
    runtime_config: analysis_plan.yaml

    config_sections:
      - experiment
      - inputs
      - routing

    input_artifacts:
      - artifact_type: analysis_plan_yaml
        source: validated_analysis_plan

      - artifact_type: resolved_analysis_routing
        source: resolved_analysis_routing

    output_artifacts:
      - artifact_type: input_inventory
        path: control/input_discovery/input_discovery.inventory.yaml

      - artifact_type: input_sample_manifest
        path: control/input_discovery/input_discovery.samples.tsv

      - artifact_type: metrics
        path: control/input_discovery/input_discovery.summary.tsv

      - artifact_type: session_info
        path: control/input_discovery/input_discovery.session.txt

    checkpoint_after: PCC_INPUT_DISCOVERY
    resource_class: lightweight
    can_start_from: false
    can_resume_from_output: true

    invalidates:
      - LOAD_DATA
      - QC_METRICS
      - QC_FILTER
      - QC_VISUALIZATION
      - QC_DOUBLET_DETECTION
      - QC_SCORES
      - NORMALIZATION
      - INTEGRATION
      - CLUSTERING
      - MARKERS
      - ANNOTATION
      - DIFFERENTIAL_EXPRESSION
      - PATHWAY_ANALYSIS


  LOAD_DATA:
    stage: input
    process_name: LOAD_DATA
    mode: load_phase
    script: scripts/00-Loading_data.R
    runtime_config: load_config.yaml

    config_sections:
      - project
      - input
      - output

    input_artifacts:
      - artifact_type: raw_inputs
        source: config.input.targets

      - artifact_type: raw_inputs
        source: config.input.count_dir

    output_artifacts:
      - artifact_type: loaded_seurat
        path: 00_load_data/seu.rds

      - artifact_type: metrics
        path: 00_load_data/00_load_data_summary.csv

      - artifact_type: session_info
        path: 00_load_data/00_sessionInfo.txt

    checkpoint_after: PCC_LOAD_DATA
    resource_class: high_memory
    can_start_from: false
    can_resume_from_output: true

    invalidates:
      - QC_METRICS
      - QC_FILTER
      - QC_VISUALIZATION
      - QC_DOUBLET_DETECTION
      - QC_SCORES
      - NORMALIZATION
      - INTEGRATION
      - CLUSTERING
      - MARKERS
      - ANNOTATION
      - DIFFERENTIAL_EXPRESSION
      - PATHWAY_ANALYSIS

  QC_METRICS:
    stage: qc
    process_name: QC_METRICS
    mode: analysis_plan_qc_process
    script: scripts/01a_qc_metrics.R
    runtime_config: analysis_plan.yaml

    config_sections:
      - project
      - experiment
      - inputs
      - qc

    input_artifacts:
      - artifact_type: loaded_seurat
        path: 00_load_data/seu.rds

      - artifact_type: resolved_load_config
        path: control/load_config/load_config.resolved.yaml

    output_artifacts:
      - artifact_type: qc_metrics_seurat
        path: 01a_qc_metrics/seu_qc_metrics.rds

      - artifact_type: metrics
        path: 01a_qc_metrics/01a_qc_metrics_summary.csv

      - artifact_type: per_sample_metrics
        path: 01a_qc_metrics/01a_qc_metrics_by_sample.csv

      - artifact_type: cell_metadata
        path: 01a_qc_metrics/01a_qc_metrics_cell_metadata.csv

      - artifact_type: session_info
        path: 01a_qc_metrics/01a_sessionInfo.txt

    checkpoint_after: PCC_QC_METRICS
    resource_class: high_memory
    can_start_from: true
    can_resume_from_output: true

    invalidates:
      - QC_THRESHOLD_RESOLUTION
      - QC_THRESHOLD_IMPACT_SUMMARY
      - QC_FILTER
      - QC_VISUALIZATION
      - QC_DOUBLET_DETECTION
      - QC_SCORES
      - NORMALIZATION
      - INTEGRATION
      - CLUSTERING

  QC_THRESHOLD_RESOLUTION:
    stage: qc
    process_name: QC_THRESHOLD_RESOLUTION
    mode: analysis_plan_qc_process
    script: scripts/control/resolve_qc_thresholds.py
    runtime_config: analysis_plan.yaml

    config_sections:
      - plan
      - experiment
      - inputs
      - qc

    input_artifacts:
      - artifact_type: analysis_plan_yaml
        source: validated_analysis_plan

      - artifact_type: metrics
        path: 01a_qc_metrics/01a_qc_metrics_summary.csv

      - artifact_type: per_sample_metrics
        path: 01a_qc_metrics/01a_qc_metrics_by_sample.csv

      - artifact_type: cell_metadata
        path: 01a_qc_metrics/01a_qc_metrics_cell_metadata.csv

    output_artifacts:
      - artifact_type: qc_threshold_policy
        path: control/qc_thresholds/qc_threshold_policy.yaml

      - artifact_type: qc_threshold_policy
        path: control/qc_thresholds/qc_threshold_policy.tsv

      - artifact_type: qc_threshold_resolution
        path: control/qc_thresholds/qc_threshold_resolution.summary.tsv

      - artifact_type: session_info
        path: control/qc_thresholds/qc_threshold_resolution.session.txt

    checkpoint_after: PCC_QC_THRESHOLD_RESOLUTION
    resource_class: lightweight
    can_start_from: true
    can_resume_from_output: true

    invalidates:
      - QC_THRESHOLD_IMPACT_SUMMARY
      - QC_FILTER
      - QC_VISUALIZATION
      - QC_DOUBLET_DETECTION
      - QC_SCORES
      - NORMALIZATION
      - INTEGRATION
      - CLUSTERING

  QC_THRESHOLD_IMPACT_SUMMARY:
    stage: qc_control
    process_name: QC_THRESHOLD_IMPACT_SUMMARY
    mode: analysis_plan_qc_process
    script: scripts/control/summarize_qc_threshold_impact.py
    runtime_config: qc_threshold_policy.yaml

    config_sections:
      - qc_threshold_policy

    input_artifacts:
      - artifact_type: qc_threshold_policy
        path: control/qc_thresholds/qc_threshold_policy.yaml

      - artifact_type: cell_metadata
        path: 01a_qc_metrics/01a_qc_metrics_cell_metadata.csv

      - artifact_type: per_sample_metrics
        path: 01a_qc_metrics/01a_qc_metrics_by_sample.csv

    output_artifacts:
      - artifact_type: qc_threshold_impact
        path: control/qc_threshold_impact/qc_threshold_impact.yaml

      - artifact_type: qc_threshold_impact_by_sample
        path: control/qc_threshold_impact/qc_threshold_impact_by_sample.csv

      - artifact_type: qc_threshold_impact_by_metric
        path: control/qc_threshold_impact/qc_threshold_impact_by_metric.csv

      - artifact_type: qc_threshold_overlap_summary
        path: control/qc_threshold_impact/qc_threshold_overlap_summary.csv

      - artifact_type: qc_lower_tail_by_sample
        path: control/qc_threshold_impact/qc_lower_tail_by_sample.csv

      - artifact_type: qc_lower_tail_summary
        path: control/qc_threshold_impact/qc_lower_tail_summary.csv

      - artifact_type: qc_threshold_impact_summary
        path: control/qc_threshold_impact/qc_threshold_impact.summary.tsv

      - artifact_type: session_info
        path: control/qc_threshold_impact/qc_threshold_impact.session.txt

    checkpoint_after: PCC_QC_THRESHOLD_IMPACT_SUMMARY
    resource_class: lightweight
    can_start_from: true
    can_resume_from_output: true

    invalidates:
      - QC_FILTER
      - QC_VISUALIZATION
      - QC_DOUBLET_DETECTION
      - QC_SCORES
      - NORMALIZATION
      - INTEGRATION
      - CLUSTERING

  VALIDATE_QC_THRESHOLD_APPROVAL:
    stage: qc_control
    process_name: VALIDATE_QC_THRESHOLD_APPROVAL
    mode: qc_threshold_approval_phase
    script: scripts/control/validate_qc_threshold_policy.py
    runtime_config: approved_qc_threshold_policy.yaml

    config_sections:
      - plan
      - experiment
      - qc

    input_artifacts:
      - artifact_type: analysis_plan_yaml
        source: validated_analysis_plan

      - artifact_type: qc_threshold_policy
        source: human_reviewed_policy

    output_artifacts:
      - artifact_type: approved_qc_threshold_policy
        path: control/qc_threshold_approval/approved_qc_threshold_policy.yaml

      - artifact_type: qc_threshold_approval_summary
        path: control/qc_threshold_approval/qc_threshold_approval.summary.tsv

      - artifact_type: session_info
        path: control/qc_threshold_approval/qc_threshold_approval.session.txt

    checkpoint_after: PCC_QC_THRESHOLD_APPROVED
    resource_class: lightweight
    can_start_from: true
    can_resume_from_output: true

    invalidates:
      - QC_FILTER
      - QC_VISUALIZATION
      - QC_DOUBLET_DETECTION
      - QC_SCORES
      - NORMALIZATION
      - INTEGRATION
      - CLUSTERING

  QC_FILTER_POLICY:
    stage: qc
    process_name: QC_FILTER_POLICY
    mode: qc_filter_policy_phase
    script: scripts/01e_qc_filter_policy.R
    runtime_config: approved_qc_threshold_policy.yaml

    config_sections:
      - qc_threshold_policy

    input_artifacts:
      - artifact_type: qc_metrics_seurat
        path: 01a_qc_metrics/seu_qc_metrics.rds

      - artifact_type: approved_qc_threshold_policy
        path: control/qc_threshold_approval/approved_qc_threshold_policy.yaml

    output_artifacts:
      - artifact_type: qc_filtered_seurat
        path: 01e_qc_filter_policy/seu_qc_filtered.rds

      - artifact_type: metrics
        path: 01e_qc_filter_policy/01e_qc_filter_summary.csv

      - artifact_type: per_sample_metrics
        path: 01e_qc_filter_policy/01e_qc_filter_by_sample.csv

      - artifact_type: cell_metadata
        path: 01e_qc_filter_policy/01e_qc_filter_cell_decisions.csv

      - artifact_type: session_info
        path: 01e_qc_filter_policy/01e_sessionInfo.txt

    checkpoint_after: PCC_QC_FILTER
    resource_class: high_memory
    can_start_from: true
    can_resume_from_output: true

    invalidates:
      - QC_VISUALIZATION
      - QC_DOUBLET_DETECTION
      - QC_SCORES
      - NORMALIZATION
      - INTEGRATION
      - CLUSTERING

  QC_FILTER:
    stage: qc
    process_name: QC_FILTER
    mode: qc_filter_phase
    script: scripts/01_qc_filter.R
    runtime_config: qc_filter_config.yaml

    config_sections:
      - project
      - output
      - qc

    input_artifacts:
      - artifact_type: loaded_seurat
        path: 00_load_data/seu.rds

    output_artifacts:
      - artifact_type: qc_filtered_seurat
        path: 01_qc_filter/seu_qc_filtered.rds

      - artifact_type: metrics
        path: 01_qc_filter/01_qc_summary.csv

      - artifact_type: session_info
        path: 01_qc_filter/01_sessionInfo.txt

    checkpoint_after: PCC_QC_FILTER
    resource_class: high_memory
    can_start_from: true
    can_resume_from_output: true

    invalidates:
      - QC_VISUALIZATION
      - QC_DOUBLET_DETECTION
      - QC_SCORES
      - NORMALIZATION
      - INTEGRATION
      - CLUSTERING
      - MARKERS
      - ANNOTATION
      - DIFFERENTIAL_EXPRESSION
      - PATHWAY_ANALYSIS


  QC_VISUALIZATION_POLICY:
    stage: qc
    process_name: QC_VISUALIZATION_POLICY
    mode: qc_visualization_policy_phase
    script: scripts/01f_qc_visualization_policy.R
    runtime_config: approved_qc_threshold_policy.yaml

    config_sections:
      - qc_threshold_policy

    input_artifacts:
      - artifact_type: qc_metrics_seurat
        path: 01a_qc_metrics/seu_qc_metrics.rds

      - artifact_type: qc_filtered_seurat
        path: 01e_qc_filter_policy/seu_qc_filtered.rds

      - artifact_type: cell_metadata
        path: 01e_qc_filter_policy/01e_qc_filter_cell_decisions.csv

      - artifact_type: approved_qc_threshold_policy
        path: control/qc_threshold_approval/approved_qc_threshold_policy.yaml

    output_artifacts:
      - artifact_type: qc_visualization_summary
        path: 01f_qc_visualization_policy/01f_qc_visualization_summary.csv

      - artifact_type: qc_metric_distributions
        path: 01f_qc_visualization_policy/01f_qc_metric_distributions.csv

      - artifact_type: per_sample_metrics
        path: 01f_qc_visualization_policy/01f_qc_by_sample_before_after.csv

      - artifact_type: qc_sample_retention
        path: 01f_qc_visualization_policy/01f_qc_sample_retention.csv

      - artifact_type: qc_exclusion_reasons
        path: 01f_qc_visualization_policy/01f_qc_exclusion_reasons.csv

      - artifact_type: cell_metadata
        path: 01f_qc_visualization_policy/01f_qc_cell_metadata_before_after.csv

      - artifact_type: qc_visualization_report
        path: 01f_qc_visualization_policy/01f_qc_*.png

      - artifact_type: session_info
        path: 01f_qc_visualization_policy/01f_sessionInfo.txt

    checkpoint_after: PCC_QC_VISUALIZATION
    resource_class: medium_memory
    can_start_from: true
    can_resume_from_output: true

    invalidates:
      - QC_DOUBLET_DETECTION
      - QC_SCORES
      - NORMALIZATION
      - INTEGRATION
      - CLUSTERING

  QC_VISUALIZATION:
    stage: qc
    process_name: QC_VISUALIZATION
    mode: qc_visualization_phase
    script: scripts/01b_qc_visualization.R
    runtime_config: qc_visualization_config.yaml

    config_sections:
      - project
      - output

    input_artifacts:
      - artifact_type: qc_filtered_seurat
        path: 01_qc_filter/seu_qc_filtered.rds

    output_artifacts:
      - artifact_type: qc_visualization_report
        path: 01b_qc_visualization

      - artifact_type: metrics
        path: 01b_qc_visualization/01b_qc_summary.csv

      - artifact_type: per_sample_metrics
        path: 01b_qc_visualization/01b_qc_by_sample.csv

      - artifact_type: per_group_metrics
        path: 01b_qc_visualization/01b_qc_by_group.csv

      - artifact_type: cell_metadata
        path: 01b_qc_visualization/01b_qc_cell_metadata.csv

      - artifact_type: session_info
        path: 01b_qc_visualization/01b_sessionInfo.txt

    checkpoint_after: PCC_PRE_DOUBLET
    resource_class: medium_memory
    can_start_from: true
    can_resume_from_output: true
    invalidates: []


  QC_DOUBLET_DETECTION:
    stage: qc
    process_name: QC_DOUBLET_DETECTION
    mode: doublet_phase
    script: scripts/01c_doublet_detection.R
    runtime_config: doublet_config.yaml

    config_sections:
      - project
      - output
      - doublet

    input_artifacts:
      - artifact_type: qc_filtered_seurat
        path: 01_qc_filter/seu_qc_filtered.rds

    output_artifacts:
      - artifact_type: singlet_seurat
        path: 01c_doublet_detection/seu_singlets.rds

      - artifact_type: metrics
        path: 01c_doublet_detection/01c_doublet_summary.csv

      - artifact_type: per_sample_metrics
        path: 01c_doublet_detection/01c_doublet_by_sample.csv

      - artifact_type: cell_metadata
        path: 01c_doublet_detection/01c_doublet_metadata.csv

      - artifact_type: session_info
        path: 01c_doublet_detection/01c_sessionInfo.txt

    checkpoint_after: PCC_POST_DOUBLET
    resource_class: very_high_memory
    can_start_from: true
    can_resume_from_output: true

    invalidates:
      - QC_SCORES
      - NORMALIZATION
      - INTEGRATION
      - CLUSTERING
      - MARKERS
      - ANNOTATION
      - DIFFERENTIAL_EXPRESSION
      - PATHWAY_ANALYSIS

  DOUBLET_DETECTION_SCORING:
    stage: qc
    process_name: DOUBLET_DETECTION_SCORING
    mode: doublet_detection_scoring_phase
    script: scripts/01g_doublet_detection_scoring.R
    runtime_config: doublet_config.yaml

    config_sections:
      - project
      - output
      - doublet

    input_artifacts:
      - artifact_type: qc_filtered_seurat
        path: 01e_qc_filter_policy/seu_qc_filtered.rds

    output_artifacts:
      - artifact_type: doublet_scored_seurat
        path: 01g_doublet_detection_scoring/seu_doublet_scored.rds

      - artifact_type: metrics
        path: 01g_doublet_detection_scoring/01g_doublet_detection_summary.csv

      - artifact_type: per_sample_metrics
        path: 01g_doublet_detection_scoring/01g_doublet_detection_by_sample.csv

      - artifact_type: cell_metadata
        path: 01g_doublet_detection_scoring/01g_doublet_detection_cell_scores.csv

      - artifact_type: metrics
        path: 01g_doublet_detection_scoring/01g_doublet_detection_pk_sweep.csv

      - artifact_type: performance_metrics
        path: 01g_doublet_detection_scoring/01g_doublet_detection_performance.csv

      - artifact_type: session_info
        path: 01g_doublet_detection_scoring/01g_sessionInfo.txt

    checkpoint_after: PCC_DOUBLET_DETECTION_SCORED
    resource_class: very_high_memory
    can_start_from: true
    can_resume_from_output: true

    invalidates:
      - DOUBLET_POLICY_RESOLUTION
      - DOUBLET_FILTER
      - QC_SCORES
      - NORMALIZATION
      - INTEGRATION
      - CLUSTERING

  DOUBLET_POLICY_RESOLUTION:
    stage: qc_control
    process_name: DOUBLET_POLICY_RESOLUTION
    mode: doublet_policy_resolution_phase
    script: scripts/control/resolve_doublet_policy.py
    runtime_config: doublet_scoring_outputs

    config_sections:
      - doublet_scoring

    input_artifacts:
      - artifact_type: metrics
        path: 01g_doublet_detection_scoring/01g_doublet_detection_summary.csv

      - artifact_type: per_sample_metrics
        path: 01g_doublet_detection_scoring/01g_doublet_detection_by_sample.csv

      - artifact_type: cell_metadata
        path: 01g_doublet_detection_scoring/01g_doublet_detection_cell_scores.csv

    output_artifacts:
      - artifact_type: doublet_detection_policy
        path: control/doublet_policy/doublet_policy.yaml

